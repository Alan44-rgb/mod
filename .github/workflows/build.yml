name: Build Pulse Counter
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Decode sound asset
        shell: pwsh
        run: |
          $encoded = Get-Content -Raw resources/ding.wav.b64
          [IO.File]::WriteAllBytes((Join-Path $PWD resources/ding.wav), [Convert]::FromBase64String($encoded))
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          target: Win64
      - uses: actions/upload-artifact@v4
        with:
          name: PulseCounter-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
